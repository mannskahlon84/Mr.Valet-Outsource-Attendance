services:
  - type: web
    name: manpower-backend
    env: python
    plan: free
    rootDir: backend
    healthCheckPath: /health/
    buildCommand: "pip install -r requirements.txt"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manpower-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHON_VERSION
        value: "3.10.13"

databases:
  - name: manpower-db
    databaseName: manpower
    user: render_user
    plan: free
