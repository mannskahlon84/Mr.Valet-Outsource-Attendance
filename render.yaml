services:
  - type: web
    name: manpower-backend
    env: python
    plan: free
    rootDir: backend
    healthCheckPath: /health/
    buildCommand: "pip install -r requirements.txt"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manpower-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: "production"
      - key: AUTO_SEED
        value: "false"
      # The Vercel site's address, for password-reset links (set in the dashboard)
      - key: FRONTEND_URL
        sync: false
      # Email for password resets (set in the dashboard)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: manpower-db
    databaseName: manpower
    user: render_user
    plan: free
