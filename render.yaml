services:
  - type: web
    name: manpower-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manpower-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHON_VERSION
        value: "3.10.13"

databases:
  - name: manpower-db
    databaseName: manpower
    user: render_user
    plan: free
